specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Afternote
    network: sepolia
    source:
      address: "0x1b03466F029193705FF309563C6153b61CE3d106"
      abi: Afternote
      startBlock: 11974046
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Vault
      abis:
        - name: Afternote
          file: ./abis/Afternote.json
      eventHandlers:
        - event: VaultAdded(indexed uint256,indexed address,indexed bytes32,bytes32,bytes,address[],bool)
          handler: handleVaultAdded
        - event: VaultPinged(indexed uint256,indexed address)
          handler: handleVaultPinged
        - event: VaultReleased(indexed uint256,indexed address)
          handler: handleVaultReleased
        - event: VaultUpdated(indexed uint256,indexed address,indexed bytes32,bytes32,bytes,address[],bool)
          handler: handleVaultUpdated
      file: ./src/afternote.ts
